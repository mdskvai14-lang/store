<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AppZone BD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>

/* Layout: dark storefront band + hero search, featured scroller, app grid; full-screen admin sheet. Dark-first, green accent as in the reference. */
:root{
  --bg:#0c0f12; --surface:#151a20; --surface2:#1c232b; --line:#27313b;
  --fg:#e9eef3; --muted:#95a3b0; --accent:#2fb344; --accent-ink:#04210c;
  --price:#f2b84b; --price-ink:#2a1c00; --danger:#ef6b6b; --hero:#050708;
  --font-body:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Space Grotesk","Hind Siliguri",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f5f3; --surface:#ffffff; --surface2:#ecf1ee; --line:#d6dfd9;
    --fg:#14201a; --muted:#566860; --accent:#168a38; --accent-ink:#ffffff;
    --price:#b86e00; --price-ink:#ffffff; --danger:#c93a3a; --hero:#0f1f17;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f5f3; --surface:#ffffff; --surface2:#ecf1ee; --line:#d6dfd9;
  --fg:#14201a; --muted:#566860; --accent:#168a38; --accent-ink:#ffffff;
  --price:#b86e00; --price-ink:#ffffff; --danger:#c93a3a; --hero:#0f1f17;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}

/* nav */
.nav{background:var(--hero);color:#e9eef3;border-bottom:1px solid #1d3a26}
.navin{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--accent);margin-right:auto;letter-spacing:.02em}
.nav .nbtn{background:transparent;border:1px solid #2b4a35;color:#dfe9e2;border-radius:999px;padding:5px 14px;font-size:.875rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.nav .nbtn:hover{border-color:var(--accent)}

/* hero */
.hero{background:var(--hero);color:#e9eef3;border-bottom:1px solid #1d3a26;padding-block:36px 30px;text-align:center}
.hero h1{font-family:var(--font-display);font-weight:500;font-size:clamp(1.9rem,6vw,2.7rem);letter-spacing:-.01em;text-wrap:balance}
.hero p{color:#9fb0a6;margin-top:6px;text-wrap:balance}
.search{display:flex;max-width:560px;margin:20px auto 0;background:#fff;border-radius:999px;overflow:hidden;border:2px solid #fff}
.search input{flex:1;min-width:0;border:0;padding:11px 18px;background:#fff;color:#111;font-size:1rem}
.search input::placeholder{color:#777}
.search span{background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0 18px;font-weight:700}
.hero .how{font-size:.85rem;margin-top:14px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:thin}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* sections */
.sec{padding-top:22px}
.sec h2{font-size:1.1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.arrows{margin-left:auto;display:flex;gap:6px}
.arrows button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
.rcard{flex:none;width:min(280px,80vw);scroll-snap-align:start;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}
.rcard .tx{min-width:0;flex:1}
.rcard .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;min-width:0;overflow:hidden}
.card:hover,.rcard:hover{border-color:var(--accent)}
.card-name{font-size:.95rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;min-height:2.5em;overflow-wrap:anywhere}
.card-meta{font-size:.8rem;color:var(--muted);min-height:1.2em}
.ico{display:block;border-radius:22%;object-fit:cover;flex:none}
.tile{display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-display)}
.tag{display:inline-block;border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:700;font-family:var(--font-display)}
.tag.free{background:var(--accent);color:var(--accent-ink)}
.tag.paid{background:var(--price);color:var(--price-ink)}
.ribbon{position:absolute;top:8px;left:-26px;transform:rotate(-45deg);width:92px;text-align:center;font-size:.65rem;font-weight:700;color:#fff;padding:2px 0;letter-spacing:.05em}
.ribbon.new{background:#d63b41}.ribbon.upd{background:#2b6fd1}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-block:22px 28px;color:var(--muted);font-size:.9rem;display:flex;gap:6px 18px;flex-wrap:wrap}
.foot a{color:var(--accent)}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;font-weight:600;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 12px;font-size:.88rem}
.btn.wide{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.lbl{font-size:.88rem;font-weight:600}
.help{font-size:.8rem;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea,.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.fld textarea{min-height:96px;resize:vertical}
.fld input:disabled{opacity:.5}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.err{color:var(--danger);font-size:.9rem;margin:0 0 12px}

/* modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:max(0px,env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px;padding-bottom:22px}}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-size:1.4rem;line-height:1;cursor:pointer}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-right:34px}
.dhead h2{font-size:1.25rem;line-height:1.25;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;margin:6px 0 18px;overflow-wrap:anywhere}
.demo{font-size:.8rem;color:var(--price);margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.steps{margin:0 0 14px;padding-left:20px;display:grid;gap:6px}
.numrow{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 8px 8px 14px;margin-bottom:14px}
.num{flex:1;font-family:var(--font-display);font-size:1.25rem;font-weight:700;letter-spacing:.04em;user-select:all}
.msg{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:0 0 10px;font-family:var(--font-body);overflow-wrap:anywhere}
.warn{font-size:.82rem;color:var(--muted);margin-top:12px}

/* admin */
.adminov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.ahead{display:flex;align-items:center;gap:10px;padding-block:14px}
.ahead h2{font-size:1.15rem;margin-right:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.arow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ainfo{flex:1;min-width:0;display:flex;flex-direction:column}
.ainfo strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ainfo span{font-size:.82rem}
.aact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.abody{padding-bottom:24px;max-width:720px;margin:0 auto}
.bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.barin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:720px;margin:0 auto}
.bstat{margin-right:auto;font-size:.9rem}
.iconrow{display:flex;gap:12px;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;max-width:calc(100vw - 32px);pointer-events:none}
#toast div{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.92rem;margin-top:6px}
#toast div.bad{background:var(--danger);color:#fff}
.mw0{min-width:0}.sub{font-size:.8rem}.sub2{font-size:.88rem}.gap8{margin-top:8px}.h3gap{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.row{display:flex;gap:8px}.rowwrap{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card,.rcard{transition:border-color .15s}}

</style>
</head>
<body>
<div id="app"></div>
<noscript>এই সাইট দেখতে ব্রাউজারে JavaScript চালু থাকতে হবে।</noscript>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
function add(p,k){
  if(k==null||k===false)return;
  if(Array.isArray(k)){k.forEach(x=>add(p,x));return}
  p.append(k.nodeType?k:document.createTextNode(String(k)));
}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(k=>{
    const v=attrs[k];
    if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='hidden')e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  });
  kids.forEach(k=>add(e,k));
  return e;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const safeJson=o=>JSON.stringify(o).replace(/</g,'\\u003c').replace(/[\u2028\u2029]/g,c=>'\\u'+c.charCodeAt(0).toString(16));
const isHttp=u=>/^https?:\/\//i.test(u||'');
const fmtPrice=a=>a.price>0?'৳ '+a.price:'ফ্রি';
const newId=()=>'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let S={store:{},apps:[]};
let BASE=JSON.stringify(S);
const ui={q:'',cat:'',modal:null,order:null,admin:false,tab:'apps',editing:null,confirmDel:null,dirty:false,publishing:false};
let isAdmin=false, lastFocus=null, barEl=null;
const el={};

/* ---------- theme ---------- */
function applyTheme(t){
  if(t)document.documentElement.setAttribute('data-theme',t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  const next=cur==='light'?'dark':'light';
  applyTheme(next);
  try{localStorage.setItem('theme',next)}catch(e){}
  el.theme.textContent=next==='light'?'ডার্ক':'লাইট';
}

/* ---------- small ui helpers ---------- */
function toast(msg,bad){
  const t=h('div',{class:bad?'bad':'',text:msg});
  el.toast.append(t);
  setTimeout(()=>t.remove(),bad?5000:2600);
}
function flash(btn,txt){
  const old=btn.textContent;btn.textContent=txt;
  setTimeout(()=>{btn.textContent=old},1700);
}
async function copy(text,node,btn){
  try{await navigator.clipboard.writeText(text);flash(btn,'কপি হয়েছে ✓')}
  catch(e){
    try{const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(_){}
    flash(btn,'সিলেক্ট হয়েছে, কপি করুন');
  }
}
function icon(a,size){
  let e;
  if(a.icon){e=h('img',{class:'ico',src:a.icon,alt:'',width:size,height:size})}
  else{
    let n=0;for(const ch of a.name||'?')n=(n*31+ch.codePointAt(0))%360;
    e=h('div',{class:'ico tile',text:Array.from(a.name||'?')[0].toUpperCase()});
    e.style.background='hsl('+n+' 45% 38%)';
    e.style.fontSize=Math.round(size*0.45)+'px';
  }
  e.style.width=size+'px';e.style.height=size+'px';
  return e;
}
function tag(a){return h('span',{class:'tag '+(a.price>0?'paid':'free'),text:fmtPrice(a)})}
function meta(a){return [a.version?'v'+a.version:'',a.size].filter(Boolean).join(' · ')}
function lockScroll(){document.body.classList.toggle('lock',!!(ui.modal||ui.admin))}

/* ---------- store view ---------- */
function openModal(type,id){lastFocus=document.activeElement;ui.modal={type,id};renderModal()}
function closeModal(){ui.modal=null;renderModal();if(lastFocus&&lastFocus.focus)lastFocus.focus()}

function card(a){
  const open=()=>openModal('detail',a.id);
  return h('div',{class:'card',role:'button',tabindex:'0','aria-label':a.name,onclick:open,onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}},
    a.badge?h('span',{class:'ribbon '+(a.badge==='NEW'?'new':'upd'),text:a.badge}):null,
    icon(a,84),
    h('h3',{class:'card-name',text:a.name}),
    h('p',{class:'card-meta',text:meta(a)}),
    tag(a));
}
function rcard(a){
  const open=()=>openModal('detail',a.id);
  return h('div',{class:'rcard',role:'button',tabindex:'0','aria-label':a.name,onclick:open,onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}},
    icon(a,52),
    h('div',{class:'tx'},h('div',{class:'nm',text:a.name}),h('div',{class:'muted sub',text:meta(a)})),
    tag(a));
}
function renderChips(){
  const cats=[];S.apps.forEach(a=>{if(a.category&&!cats.includes(a.category))cats.push(a.category)});
  if(ui.cat&&!cats.includes(ui.cat))ui.cat='';
  el.chips.textContent='';
  if(!cats.length)return;
  const mk=(label,val)=>h('button',{class:'chip','aria-pressed':String(ui.cat===val),text:label,onclick:()=>{ui.cat=val;renderChips();renderLists()}});
  el.chips.append(mk('সব',''),...cats.map(c=>mk(c,c)));
}
function renderLists(){
  const box=el.lists;box.textContent='';
  const q=ui.q.trim().toLowerCase();
  const list=S.apps.filter(a=>(!ui.cat||a.category===ui.cat)&&(!q||(a.name+' '+(a.category||'')+' '+(a.desc||'')).toLowerCase().includes(q)));
  const filtering=!!(q||ui.cat);
  const feat=S.apps.filter(a=>a.top);
  if(!filtering&&feat.length){
    const rail=h('div',{class:'rail'},feat.map(rcard));
    const go=d=>()=>rail.scrollBy({left:d*300,behavior:'smooth'});
    box.append(h('section',{class:'sec'},
      h('h2',{},'বিশেষ অ্যাপ',h('span',{class:'arrows'},h('button',{'aria-label':'আগে',onclick:go(-1),text:'‹'}),h('button',{'aria-label':'পরে',onclick:go(1),text:'›'}))),
      rail));
  }
  let body;
  if(list.length)body=h('div',{class:'grid'},list.map(card));
  else if(!S.apps.length)body=h('p',{class:'empty',text:isAdmin?'এখনো কোনো অ্যাপ নেই। অ্যাডমিন থেকে প্রথম অ্যাপ যোগ করুন।':'শিগগিরই অ্যাপ যোগ হবে।'});
  else body=h('p',{class:'empty',text:'কিছু পাওয়া যায়নি। অন্য নামে খুঁজে দেখুন।'});
  box.append(h('section',{class:'sec'},h('h2',{text:filtering?'ফলাফল ('+list.length+')':'নতুন অ্যাপ'}),body));
}
function updateChrome(){
  document.title=S.store.name||'অ্যাপ স্টোর';
  el.brand.textContent=S.store.name;
  el.h1.textContent=S.store.name;
  el.tag.textContent=S.store.tagline;
  el.foot.textContent='';
  el.foot.append(h('span',{text:'© '+S.store.name}));
  if(S.store.telegram)el.foot.append(h('span',{},'যোগাযোগ: ',h('a',{href:'https://t.me/'+S.store.telegram,target:'_blank',rel:'noopener noreferrer',text:'@'+S.store.telegram})));
  el.support.hidden=!S.store.telegram;
  if(S.store.telegram)el.support.href='https://t.me/'+S.store.telegram;
}

/* ---------- detail + order modal ---------- */
function actionBtn(a){
  if(a.price>0)return h('button',{class:'btn primary wide',onclick:()=>openModal('order',a.id),text:'কিনুন · ৳ '+a.price});
  if(isHttp(a.link))return h('a',{class:'btn primary wide',href:a.link,target:'_blank',rel:'noopener noreferrer',text:'ডাউনলোড (ফ্রি)'});
  return h('button',{class:'btn wide',disabled:true,text:'ডাউনলোড লিংক শিগগিরই আসছে'});
}
function detailPanel(a){
  return h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':a.name},
    h('button',{class:'x','aria-label':'বন্ধ করুন',onclick:closeModal,text:'×'}),
    h('div',{class:'dhead'},icon(a,76),
      h('div',{class:'mw0'},h('h2',{text:a.name}),h('p',{class:'muted sub2',text:[a.category,meta(a)].filter(Boolean).join(' · ')}),tag(a))),
    a.demo?h('p',{class:'demo',text:'ডেমো এন্ট্রি, নিজের অ্যাপ যোগ করার পর মুছে ফেলুন।'}):null,
    a.desc?h('p',{class:'desc',text:a.desc}):null,
    actionBtn(a));
}
function orderPanel(a){
  const st={method:'bkash',sender:'',trx:''};
  ui.order=st;
  const numNode=h('output',{class:'num'});
  const copyNum=h('button',{class:'btn sm',text:'কপি'});
  const prev=h('pre',{class:'msg'});
  const tg=h('a',{class:'btn primary wide',target:'_blank',rel:'noopener noreferrer',text:'টেলিগ্রামে অর্ডার পাঠান'});
  const copyMsg=h('button',{class:'btn wide gap8',text:'অর্ডার মেসেজ কপি করুন'});
  const mBkash=h('button',{'aria-pressed':'true',text:'বিকাশ'});
  const mNagad=h('button',{'aria-pressed':'false',text:'নগদ'});
  const msg=()=>'অর্ডার: '+a.name+(a.version?' v'+a.version:'')+'\nদাম: '+a.price+' BDT\nমেথড: '+(st.method==='bkash'?'bKash':'Nagad')+'\nসেন্ডার নম্বর: '+st.sender+'\nTrxID: '+st.trx;
  const valid=()=>/^01[3-9]\d{8}$/.test(st.sender)&&/^[A-Za-z0-9]{6,20}$/.test(st.trx);
  function refresh(){
    mBkash.setAttribute('aria-pressed',String(st.method==='bkash'));
    mNagad.setAttribute('aria-pressed',String(st.method==='nagad'));
    numNode.textContent=st.method==='bkash'?S.store.bkash:S.store.nagad;
    prev.textContent=msg();
    const ok=valid();
    if(ok&&S.store.telegram){tg.href='https://t.me/'+S.store.telegram+'?text='+encodeURIComponent(msg());tg.setAttribute('aria-disabled','false')}
    else{tg.removeAttribute('href');tg.setAttribute('aria-disabled','true')}
    copyMsg.disabled=!ok;
  }
  mBkash.onclick=()=>{st.method='bkash';refresh()};
  mNagad.onclick=()=>{st.method='nagad';refresh()};
  copyNum.onclick=()=>copy(numNode.textContent,numNode,copyNum);
  copyMsg.onclick=()=>copy(msg(),prev,copyMsg);
  const panel=h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':a.name+' কেনা'},
    h('button',{class:'x','aria-label':'বন্ধ করুন',onclick:closeModal,text:'×'}),
    h('div',{class:'dhead'},icon(a,56),h('div',{class:'mw0'},h('h2',{text:a.name}),h('p',{class:'muted',text:'দাম: ৳ '+a.price}))),
    h('div',{class:'seg'},mBkash,mNagad),
    h('ol',{class:'steps'},
      h('li',{text:'নিচের নম্বরে ৳ '+a.price+' "Send Money" করুন।'}),
      h('li',{text:'পেমেন্টের পর পাওয়া TrxID আর আপনার নম্বর লিখুন।'}),
      h('li',{text:'টেলিগ্রামে অর্ডার পাঠান। পেমেন্ট মিলে গেলে অ্যাডমিন ডাউনলোড লিংক পাঠাবেন।'})),
    h('div',{class:'numrow'},numNode,copyNum),
    h('label',{class:'fld'},h('span',{class:'lbl',text:'আপনার বিকাশ/নগদ নম্বর'}),h('input',{class:'inp',type:'text',inputmode:'numeric',maxlength:'11',placeholder:'01XXXXXXXXX',oninput:e=>{st.sender=e.target.value.trim();refresh()}})),
    h('label',{class:'fld'},h('span',{class:'lbl',text:'TrxID'}),h('input',{class:'inp',type:'text',maxlength:'20',autocapitalize:'characters',placeholder:'যেমন 9A1B2C3D4E',oninput:e=>{st.trx=e.target.value.trim();refresh()}})),
    prev,tg,copyMsg,
    S.store.note?h('p',{class:'warn',text:S.store.note}):null,
    h('p',{class:'warn',text:'বিকাশ বা নগদের পিন/OTP কাউকে দেবেন না। এখানে তা কখনো চাওয়া হয় না।'}));
  refresh();
  return panel;
}
function renderModal(){
  const host=el.modal;host.textContent='';
  const a=ui.modal&&S.apps.find(x=>x.id===ui.modal.id);
  if(!a){ui.modal=null;host.hidden=true;lockScroll();return}
  host.hidden=false;
  host.append(ui.modal.type==='order'?orderPanel(a):detailPanel(a));
  lockScroll();
  const f=host.querySelector('.x');if(f)f.focus();
}

function build(){
  const root=$('#app');
  el.brand=h('span',{class:'brand'});
  el.support=h('a',{class:'nbtn',target:'_blank',rel:'noopener noreferrer',text:'সাপোর্ট'});
  const dark=!(document.documentElement.getAttribute('data-theme')==='light'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: light)').matches));
  el.theme=h('button',{class:'nbtn',text:dark?'লাইট':'ডার্ক',onclick:toggleTheme});
  el.h1=h('h1');el.tag=h('p');
  const inp=h('input',{type:'search',id:'q',placeholder:'অ্যাপ খুঁজুন…',autocomplete:'off',oninput:e=>{ui.q=e.target.value;renderLists()}});
  el.chips=h('div',{class:'chips'});
  el.lists=h('div',{id:'lists'});
  el.foot=h('footer',{class:'foot'});
  el.modal=h('div',{class:'overlay',hidden:true,onclick:e=>{if(e.target===el.modal)closeModal()}});
  el.toast=h('div',{id:'toast',role:'status','aria-live':'polite'});
  root.append(
    h('div',{class:'nav'},h('div',{class:'wrap navin'},el.brand,el.support,el.theme)),
    h('header',{class:'hero'},h('div',{class:'wrap'},el.h1,el.tag,
      h('div',{class:'search'},h('label',{class:'sr',for:'q',text:'অ্যাপ খুঁজুন'}),inp,h('span',{'aria-hidden':'true',text:'খুঁজুন'})),
      h('p',{class:'how',text:'ফ্রি অ্যাপ সরাসরি ডাউনলোড · পেইড অ্যাপ বিকাশ/নগদে কিনুন'}))),
    h('main',{class:'wrap'},el.chips,el.lists,el.foot),
    el.modal,el.toast);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});
}

const DEFAULT_STORE={name:'অ্যাপ স্টোর',tagline:'',bkash:'',nagad:'',telegram:'',note:''};
function showError(){
  const a=$('#app');a.textContent='';
  a.append(h('p',{class:'empty',text:'অ্যাপের তালিকা লোড করা যায়নি। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।'}));
}
function start(){
  if(!window.STORE_DATA||!Array.isArray(window.STORE_DATA.apps)){showError();return}
  S=window.STORE_DATA;S.store=Object.assign({},DEFAULT_STORE,S.store);BASE=JSON.stringify(S);
  build();updateChrome();renderChips();renderLists();
}
try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')applyTheme(t)}catch(e){}
const sc=document.createElement('script');
sc.src='data.js?t='+Date.now();sc.onload=start;sc.onerror=showError;
document.head.append(sc);
})();
</script>
</body>
</html>
